name: Source checks
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi
          components: llvm-tools
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - name: Rust models and protocol core
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          (cd firmware/wp2-apps/sdk && cargo test --locked --target "$host")
          (cd firmware/wp2-apps/fw && cargo test --locked -p wp2-core --target "$host")
      - name: Python protocol checks
        working-directory: firmware/wp2-apps
        run: uv run --locked python -m unittest discover -s tests -v
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: ./android/gradlew -p android :protocol:test :app:assembleDebug :app:lintRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-development-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: swift test --package-path ios/CompanionCore
      - run: brew install xcodegen
      - run: xcodegen generate --spec ios/Workbench/project.yml
      - run: >-
          xcodebuild -project ios/Workbench/CMFWorkbench.xcodeproj
          -scheme CMFWorkbench -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
