plugins { id 'com.android.application' }

def releaseStore = System.getenv('CMF_ANDROID_KEYSTORE')
android {
    namespace = 'app.cmfworkbench'
    compileSdk = 36
    defaultConfig {
        applicationId 'app.cmfworkbench.companion'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        if (releaseStore) {
            release {
                storeFile file(releaseStore)
                storePassword System.getenv('CMF_ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('CMF_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('CMF_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (releaseStore) signingConfig signingConfigs.release
        }
    }
}
dependencies {
    implementation project(':protocol')
    implementation 'com.google.zxing:core:3.5.3'
}
