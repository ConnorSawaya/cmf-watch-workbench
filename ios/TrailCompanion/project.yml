name: TrailCompanion
options:
  bundleIdPrefix: local.cmf
  deploymentTarget:
    iOS: '17.0'
packages:
  WireKit:
    path: ../../firmware/wp2-apps/ios/WireKit
  CompanionCore:
    path: ../CompanionCore
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''
targets:
  TrailCompanion:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: WireKit
      - package: CompanionCore
    info:
      path: Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: local.cmf.organicmaps
            CFBundleURLSchemes:
              - cmftrail
        UIBackgroundModes:
          - bluetooth-central
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cmfworkbench.companion
        PRODUCT_NAME: TrailCompanion
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: CMF Workbench
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Your location is used to show where you are and your distance from trails.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Connect to your CMF Watch Pro 2 to manage and upload watch apps.
        SWIFT_OPTIMIZATION_LEVEL: '-Osize'
        DEAD_CODE_STRIPPING: YES
        STRIP_INSTALLED_PRODUCT: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Scan the QR code displayed by your CMF watch to choose it for pairing.
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        MARKETING_VERSION: 0.2.0
        CURRENT_PROJECT_VERSION: 2
        OTHER_LDFLAGS: '-lz'
